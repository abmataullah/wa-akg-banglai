services:
  db:
    image: mysql:8.0
    container_name: wa-akg-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: WaAkg2026SecurePass
      MYSQL_DATABASE: wa_akg
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wa-akg-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-akg-app
    restart: always
    environment:
      - DATABASE_URL=mysql://root:WaAkg2026SecurePass@db:3306/wa_akg
      - AUTH_SECRET=Kj8mR2pX7nQ4vB3zF6hY9wL1tA5sC8eD
      - BASE_URL=https://wa.banglai.cloud
      - NEXTAUTH_URL=https://wa.banglai.cloud
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=https://wa.banglai.cloud
      - NEXT_PUBLIC_API_URL=https://wa.banglai.cloud/api
      - BAILEYS_LOG_LEVEL=error
      - NEXT_PUBLIC_SWAGGER_USERNAME=admin
      - NEXT_PUBLIC_SWAGGER_PASSWORD=Swagger2026
      - NEXT_PUBLIC_SWAGGER_ENABLED=true
      - TZ=Asia/Dhaka
      - LOCALE=en-US
      - ADMIN_EMAIL=admin@banglai.cloud
      - ADMIN_PASSWORD=AdminBanglai2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - uploads_data:/app/uploads
    networks:
      - wa-akg-internal
      - root_default
    labels:
      - traefik.enable=true
      - traefik.http.routers.wa-akg.rule=Host(`wa.banglai.cloud`) || Host(`wa.amarshowroom.com`)
      - traefik.http.routers.wa-akg.tls=true
      - traefik.http.routers.wa-akg.entrypoints=web,websecure
      - traefik.http.routers.wa-akg.tls.certresolver=mytlschallenge
      - traefik.http.services.wa-akg.loadbalancer.server.port=3000

volumes:
  mysql_data:
  app_data:
  uploads_data:

networks:
  wa-akg-internal:
  root_default:
    external: true
